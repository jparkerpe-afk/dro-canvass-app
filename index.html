<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DRO Canvass</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b5e20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DRO Canvass">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <header id="app-header">
    <h1>DRO Canvass</h1>
    <nav id="view-nav">
      <button id="nav-map" type="button">Map</button>
      <button id="nav-setup" type="button">Import</button>
    </nav>
  </header>

  <main id="app-main">
    <div id="setup-view">
      <section id="import-section">
        <h2>Load voter list</h2>
        <label class="file-picker" for="csv-input">Choose CSV file</label>
        <input type="file" id="csv-input" accept=".csv,text/csv">
        <p id="import-status" class="hint">No voter list loaded yet.</p>
        <div id="import-summary"></div>
      </section>

      <section id="walker-section">
        <h2>Walker name</h2>
        <p class="hint">Stored for this session. Written into every household you contact so two walkers' work can be told apart on merge.</p>
        <input type="text" id="walker-name-input" placeholder="Your name" autocomplete="name">
        <button id="walker-name-save">Save</button>
        <p id="walker-name-status" class="hint"></p>
      </section>

      <p id="sw-status" class="hint">Service worker: checking…</p>
    </div>

    <div id="map-view">
      <div id="map-container"></div>
    </div>
  </main>
</div>

<script src="js/vendor/papaparse.min.js"></script>
<script src="js/vendor/maplibre-gl.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
